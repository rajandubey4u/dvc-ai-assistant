<!DOCTYPE html>
<html>
<head>
  <title>DVC AI Assistant</title>
</head>
<body style="font-family: Arial; padding: 20px;">

<h1>DVC AI Assistant</h1>

<input type="text" id="question" placeholder="Ask question..." size="60">

<button onclick="sendQuestion()">Ask</button>

<button onclick="startVoice()">🎤 Speak</button>

<p><b>Answer:</b></p>

<div id="answer"></div>

<script>

const DIFY_API_KEY = "app-IGJEU9E92j82Xeq7CMyHu7qe";

const DIFY_API_URL = "https://api.dify.ai/v1/chat-messages";

async function sendQuestion(textInput=null) {

    let question = textInput || document.getElementById("question").value;

    const response = await fetch(DIFY_API_URL, {
        method: "POST",
        headers: {
            "Authorization": `Bearer ${DIFY_API_KEY}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            inputs: {},
            query: question,
            response_mode: "blocking",
            user: "judge-user"
        })
    });

    const data = await response.json();

    document.getElementById("answer").innerText = data.answer;
const audioResponse = await fetch('/api/tts', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        text: data.answer
    })
});

const audioBlob = await audioResponse.blob();

const audioUrl = URL.createObjectURL(audioBlob);

const audio = new Audio(audioUrl);

audio.play();

}

function startVoice() {

    const recognition = new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.onresult = function(event) {

        const transcript = event.results[0][0].transcript;

        document.getElementById("question").value = transcript;

        sendQuestion(transcript);
    };

    recognition.start();
}

</script>

</body>
</html>
